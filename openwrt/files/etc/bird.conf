# BGP with the Cilium BGP control plane: nodes advertise LoadBalancer VIPs (10.20.0.16/28)
# Traefik VIPs are advertised by multiple nodes -> ECMP (see sysctl.d/99-ecmp.conf).
# ASN: router 64513, cluster 64512.
log syslog all;

router id 192.168.20.1;

protocol device {
}

protocol kernel {
	ipv4 {
		import none;
		export where proto ~ "k8s_*";
	};
	# Install equal-cost routes from multiple nodes as a single multipath route
	merge paths on;
}

template bgp k8s {
	local 192.168.20.1 as 64513;
	neighbor as 64512;
	hold time 9;
	keepalive time 3;
	graceful restart on;
	ipv4 {
		# Only accept /32s inside the LB pool, never anything else from the cluster
		import where net ~ [ 10.20.0.16/28{32,32} ];
		export none;
	};
}

protocol bgp k8s_athena from k8s {
	neighbor 192.168.20.2;
}

protocol bgp k8s_hermes from k8s {
	neighbor 192.168.20.3;
}

protocol bgp k8s_zeus from k8s {
	neighbor 192.168.20.4;
}

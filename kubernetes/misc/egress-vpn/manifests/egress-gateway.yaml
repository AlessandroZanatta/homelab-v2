---
apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: vpn-egress
spec:
  # Match any pod with the "egress.kalexlab.xyz/policy: vpn" label
  selectors:
    - podSelector:
        matchLabels:
          egress.kalexlab.xyz/policy: vpn

  # Everything but local addresses should be routed through the VPN
  destinationCIDRs:
    - "0.0.0.0/0"
  excludedCIDRs:
    - "192.168.0.0/16"
    - "172.16.0.0/12"
    - "10.0.0.0/8"

  # Egress is through a node with the egress.kalexlab.xyz/gateway: vpn label
  # and through its dedicated 192.168.20.12 secondary IP (vpnEgressIP in topf/topf.yaml),
  # the only address the router routes through the VPN
  egressGateway:
    nodeSelector:
      matchLabels:
        egress.kalexlab.xyz/gateway: vpn

    egressIP: 192.168.20.12

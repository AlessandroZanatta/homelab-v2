---
args:
  format: cyclonedx
  targets: dtrack

  dtrack-base-url: http://dependency-track-api-server.dependency-track:8080

envVars:
  - name: SBOM_DTRACK_API_KEY
    valueFrom:
      secretKeyRef:
        name: dependency-track-secret
        key: SBOM_DTRACK_API_KEY

# TODO
resources: {}
#  requests:
#    cpu: 100m
#    memory: 100Mi
#  limits:
#    cpu: 500m
#    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65535
  runAsGroup: 65535
  fsGroup: 65535
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

tolerations: []

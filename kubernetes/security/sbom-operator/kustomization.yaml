---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sbom-operator

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: sbom-operator
    repo: https://ckotzbauer.github.io/helm-charts
    version: 0.51.1
    releaseName: sbom-operator
    namespace: sbom-operator
    valuesFile: values/sbom-operator.yaml

resources:
  - manifests

# Chart templates don't set metadata.namespace
patches:
  - target:
      kind: ^(ServiceAccount|Deployment)$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: sbom-operator

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dependency-track-ingress
spec:
  commonName: dtrack.kalexlab.xyz
  secretName: dependency-track-ingress-certificate
  dnsNames:
    - dtrack.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dependency-track-ingress
  annotations:
    external-dns.kubernetes.io/target: 10.20.0.20
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`dtrack.kalexlab.xyz`)
      services:
        - name: dependency-track-frontend
          port: web
    - kind: Rule
      match: Host(`dtrack.kalexlab.xyz`) && PathPrefix(`/api`)
      services:
        - name: dependency-track-api-server
          port: web
  tls:
    secretName: dependency-track-ingress-certificate

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dependency-track

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: dependency-track
    repo: oci://ghcr.io/dependencytrack/helm-charts
    version: 2.10.0
    releaseName: dependency-track
    namespace: dependency-track
    valuesFile: values/dependency-track.yaml

resources:
  - manifests

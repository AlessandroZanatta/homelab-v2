---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: smartctl-exporter
spec:
  instanceSelector:
    matchLabels:
      grafana.kalexlab.xyz/instance: grafana
  allowCrossNamespaceImport: true
  folder: Hardware
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  # renovate: depName="Dashboard - smartCTL"
  url: "https://grafana.com/api/dashboards/24922/revisions/1/download"

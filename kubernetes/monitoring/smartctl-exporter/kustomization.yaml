---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartctl-exporter

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: prometheus-smartctl-exporter
    repo: https://prometheus-community.github.io/helm-charts
    version: 0.17.1
    releaseName: smartctl-exporter
    namespace: smartctl-exporter
    valuesFile: values/smartctl-exporter.yaml

# TODO: check if, after a reboot, external HDD still has smart tests enabled
# patches:
#   - path: patches/external-hdd-enable-smart.yaml

resources:
  - manifests

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: loki

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: loki
    repo: https://grafana-community.github.io/helm-charts
    version: 18.7.4
    releaseName: loki
    namespace: loki
    valuesFile: values/loki.yaml

resources:
  - manifests

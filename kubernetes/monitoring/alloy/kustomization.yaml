---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alloy

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.11.0
    releaseName: alloy
    namespace: alloy
    valuesFile: values/alloy.yaml

resources:
  - manifests

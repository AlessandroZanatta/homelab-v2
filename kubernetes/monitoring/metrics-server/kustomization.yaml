---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: top-level namespace declaration is INTENTIONALLY
# not specified, read patches to understand why

resources:
  # TODO: add renovate update tag
  - "https://github.com/kubernetes-sigs/metrics-server/manifests/overlays/release?ref=v0.9.0"

patches:
  # Replace all namespaces with metrics-server
  - target:
      namespace: kube-system
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: metrics-server

  # Update the apiservice to point to metrics-server namespace
  - target:
      kind: APIService
      name: v1beta1.metrics.k8s.io
    patch: |-
      - op: replace
        path: /spec/service/namespace
        value: metrics-server

  # This rolebinding needs to be in the kube-system namespace, pointing to the
  # metrics-server service-account in metrics-server namespace
  - target:
      kind: RoleBinding
      name: metrics-server-auth-reader
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: kube-system
      - op: replace
        path: /subjects/0/namespace
        value: metrics-server

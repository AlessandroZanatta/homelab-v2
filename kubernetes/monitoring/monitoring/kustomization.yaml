---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 88.2.0
    releaseName: monitoring
    namespace: monitoring
    valuesFile: values/kube-prometheus-stack.yaml
    additionalValuesFiles:
      - values/alerts/argocd.yaml
      - values/alerts/cert-manager.yaml
      - values/alerts/cnpg.yaml
      - values/alerts/coredns.yaml
      - values/alerts/longhorn.yaml
      - values/alerts/smartctl.yaml
      - values/alerts/traefik.yaml
      - values/alerts/velero.yaml

resources:
  - manifests

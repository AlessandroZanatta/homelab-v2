---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-views-global
spec:
  instanceSelector:
    matchLabels:
      grafana.kalexlab.xyz/instance: grafana
  allowCrossNamespaceImport: true
  folder: Kubernetes
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  # renovate: depName="Dashboard - Kubernetes / Views / Global"
  url: "https://grafana.com/api/dashboards/15757/revisions/43/download"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter-temperature
spec:
  instanceSelector:
    matchLabels:
      grafana.kalexlab.xyz/instance: grafana
  allowCrossNamespaceImport: true
  folder: Kubernetes
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  # renovate: depName="Dashboard - Node Exporter Temperature"
  url: "https://grafana.com/api/dashboards/15202/revisions/1/download"

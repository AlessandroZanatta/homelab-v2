---
crds:
  enabled: true
  upgradeJob:
    enabled: true
    # Conflicts with ArgoCD, force it, ArgoCD will fix it later
    forceConflicts: true

grafana:
  enabled: true

  # Use an existing secret for the admin user.
  admin:
    existingSecret: grafana-secrets
    userKey: admin_user
    passwordKey: admin_password

  extraVolumes:
    - name: dashboard-post-process
      configMap:
        name: grafana-dashboard-post-process

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: sidecarProvider
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /tmp/dashboards

  sidecar:
    dashboards:
      enabled: true
      script: /etc/sidecar-scripts/normalize-datasource.sh
      extraMounts:
        - name: dashboard-post-process
          mountPath: /etc/sidecar-scripts
          readOnly: true
    datasources:
      watchMethod: "SLEEP"

  defaultDashboardsTimezone: Europe/Rome

  additionalDataSources:
    - access: proxy
      isDefault: false
      name: loki
      orgId: 1
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
      version: 1

  grafana.ini:
    server:
      root_url: "https://grafana.kalexlab.xyz"

    auth.generic_oauth:
      enabled: true
      name: Authelia
      auth_url: https://auth.kalexlab.xyz/api/oidc/authorization
      token_url: https://auth.kalexlab.xyz/api/oidc/token
      api_url: https://auth.kalexlab.xyz/api/oidc/userinfo
      client_id: vP36vqAl-kDRRlq0~88S1u-2jdyyktDkLDuPsHmwHp0oDnuBRg-KH4DeJXaAWXBXU4.uL7YK
      client_secret: "$__file{/etc/secrets/grafana-secrets/generic_oauth_client_secret}"
      scopes: openid profile email groups
      empty_scopes: false
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      name_attribute_path: name
      role_attribute_path: "contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'"
      use_pkce: true

  extraSecretMounts:
    - name: grafana-secrets
      secretName: grafana-secrets
      mountPath: /etc/secrets/grafana-secrets

prometheusOperator:
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false

prometheus:
  enabled: true

  prometheusSpec:
    ## If true, a nil or {} value for prometheus.prometheusSpec.serviceMonitorSelector will cause the
    ## prometheus resource to be created with selectors based on values in the helm deployment,
    ## which will also match the servicemonitors created
    serviceMonitorSelectorNilUsesHelmValues: false

    ## If true, a nil or {} value for prometheus.prometheusSpec.podMonitorSelector will cause the
    ## prometheus resource to be created with selectors based on values in the helm deployment,
    ## which will also match the podmonitors created
    podMonitorSelectorNilUsesHelmValues: false

    ## If true, a nil or {} value for prometheus.prometheusSpec.ruleSelector will cause the
    ## prometheus resource to be created with selectors based on values in the helm deployment,
    ## which will also match the PrometheusRule resources created
    ruleSelectorNilUsesHelmValues: false

    ## External URL at which Prometheus will be reachable.
    ##
    externalUrl: "https://prometheus.kalexlab.xyz"

    storageSpec:
      volumeClaimTemplate:
        metadata:
          name: prometheus-data-pvc
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 75Gi

    thanosService:
      enabled: true

    thanosServiceMonitor:
      enabled: true

    # Bugged, not added to prometheus.monitoring.coreos.com/prometheus-kube-prometheus-prometheus even though it really should

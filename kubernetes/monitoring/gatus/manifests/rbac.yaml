---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatus-sidecar
  namespace: gatus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatus-sidecar
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gatus.kalexlab.xyz
    resources:
      - endpointtemplates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gatus.kalexlab.xyz
    resources:
      - endpointtemplates/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - traefik.io
    resources:
      - ingressroutes
      - ingressroutetcps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatus-sidecar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatus-sidecar
subjects:
  - kind: ServiceAccount
    name: gatus-sidecar
    namespace: gatus

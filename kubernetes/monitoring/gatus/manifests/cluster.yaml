---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
spec:
  configuration:
    destinationPath: "s3://cnpg/gatus"
    endpointURL: "https://backups.kalexlab.xyz"
    s3Credentials:
      accessKeyId:
        name: gatus-s3-credentials
        key: accessKey
      secretAccessKey:
        name: gatus-s3-credentials
        key: secretKey
    wal:
      compression: bzip2
    data:
      compression: bzip2
  retentionPolicy: 14d
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster
spec:
  inheritedMetadata:
    labels:
      kalexlab.xyz/app: gatus
      kalexlab.xyz/component: cluster
      # TODO: add monitoring? may be meaningless
      backups.kalexlab.xyz/use: "true"
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  storage:
    storageClass: longhorn
    size: 50Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backups
        # renovate-major: depName=ghcr.io/cloudnative-pg/postgresql
        serverName: cluster-v18
  enablePDB: false
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cluster-backup
spec:
  cluster:
    name: cluster
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

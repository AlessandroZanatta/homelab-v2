---
apiVersion: v1
kind: Service
metadata:
  name: immich
  labels:
    kalexlab.xyz/app: immich
    kalexlab.xyz/component: immich
spec:
  type: ClusterIP
  ports:
    - name: immich
      port: 2283
      targetPort: http
      protocol: TCP
  selector:
    kalexlab.xyz/app: immich
    kalexlab.xyz/component: immich
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich
  labels:
    kalexlab.xyz/app: immich
    kalexlab.xyz/component: immich
spec:
  serviceName: immich
  replicas: 1
  selector:
    matchLabels:
      kalexlab.xyz/app: immich
      kalexlab.xyz/component: immich
  minReadySeconds: 5
  template:
    metadata:
      labels:
        kalexlab.xyz/app: immich
        kalexlab.xyz/component: immich
        kalexlab.xyz/monitoring: "true"
        sso.kalexlab.xyz/idp: authentik
    spec:
      restartPolicy: Always
      initContainers:
        - name: wait-deps
          image: "docker.io/library/alpine:3.24.2"
          imagePullPolicy: Always
          resources:
            requests:
              memory: 30Mi
              cpu: 1m
            limits:
              memory: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            [
              "sh",
              "-c",
              "for i in $(seq 1 300); do nc -zvw1 cache 6379 && nc -zvw1 cluster-vchord-rw 5432 && exit 0 || sleep 3; done; exit 1",
            ]
      containers:
        - name: immich
          image: "ghcr.io/immich-app/immich-server:v3.2.2"
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 2283
              protocol: TCP

          envFrom:
            - configMapRef:
                name: immich-conf
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: cluster-vchord-app
                  key: uri
          resources:
            requests:
              memory: 1Gi
              cpu: 10m
            limits:
              memory: 2.5Gi
              cpu: 2000m
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            failureThreshold: 3
            periodSeconds: 30
          volumeMounts:
            - mountPath: /usr/src/app/upload
              name: immich-uploads-pvc
            - mountPath: /immich.json
              subPath: immich.json
              name: immich-secrets
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        fsGroup: 65535
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: immich-secrets
          secret:
            secretName: immich-secrets

  volumeClaimTemplates:
    - metadata:
        name: immich-uploads-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 100Gi

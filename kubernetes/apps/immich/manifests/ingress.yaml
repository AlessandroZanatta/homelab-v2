---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-certificate
spec:
  commonName: photos.kalexlab.xyz
  secretName: immich-ingress-certificate-secret
  dnsNames:
    - photos.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-ingress
  annotations:
    external-dns.kubernetes.io/target: 192.168.10.20
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`photos.kalexlab.xyz`)
      services:
        - name: immich
          port: 2283
  tls:
    secretName: immich-ingress-certificate-secret

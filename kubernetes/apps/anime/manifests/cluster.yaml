---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
spec:
  configuration:
    destinationPath: "s3://cnpg/anime"
    endpointURL: "https://backups.kalexlab.xyz"
    s3Credentials:
      accessKeyId:
        name: anime-s3-credentials
        key: accessKey
      secretAccessKey:
        name: anime-s3-credentials
        key: secretKey
    wal:
      compression: bzip2
    data:
      compression: bzip2
  retentionPolicy: 14d
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster
spec:
  inheritedMetadata:
    labels:
      kalexlab.xyz/app: anime-v2
      kalexlab.xyz/component: cluster
      kalexlab.xyz/monitoring: "true"
      backups.kalexlab.xyz/use: "true"
    annotations:
      gatus.kalexlab.xyz/enabled: "true"
      gatus.kalexlab.xyz/scheme: tcp
      gatus.kalexlab.xyz/exclude: cluster-ro
  instances: 1
  storage:
    storageClass: longhorn
    size: 10Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backups
  enablePDB: false
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cluster-backup
spec:
  cluster:
    name: cluster
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

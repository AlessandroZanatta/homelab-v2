---
apiVersion: kro.run/v1alpha1
kind: ValkeyStandalone
metadata:
  name: queue
spec:
  # renovate: datasource=docker depName=valkey/valkey
  image: docker.io/valkey/valkey:9.1.3-alpine
  labels:
    kalexlab.xyz/app: anime-v2
    kalexlab.xyz/component: queue
    kalexlab.xyz/monitoring: "true"
  annotations:
    gatus.kalexlab.xyz/enabled: "true"
    gatus.kalexlab.xyz/scheme: tcp
  persistence:
    enabled: true
    size: 2Gi
  limits:
    memory: 200Mi

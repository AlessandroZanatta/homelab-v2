---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: queue
  labels:
    kalexlab.xyz/app: anime-v2
    kalexlab.xyz/component: queue
    kalexlab.xyz/monitoring: "true"
spec:
  kubernetesConfig:
    # renovate: datasource=docker depName=valkey/valkey
    image: docker.io/valkey/valkey:9.1.1-alpine
    imagePullPolicy: Always

    resources:
      requests:
        memory: 10Mi
        cpu: 1m
      limits:
        memory: 200Mi
        cpu: 100m
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65535
    runAsGroup: 65535
    fsGroup: 65535
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-conf
data:
  configuration.yaml: |
    # Loads default set of integrations. Do not remove.
    default_config:

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.244.0.0/23

    auth_oidc:
      client_id: apps-homeassistant
      client_secret: !secret auth_oidc__client_secret
      discovery_url: https://auth.kalexlab.xyz/application/o/apps-homeassistant/.well-known/openid-configuration
      display_name: Authentik
      roles:
        admin: infra

    mqtt: !include mqtt.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-conf
data:
  mosquitto.conf: |
    log_dest stdout
    log_timestamp true
    log_timestamp_format %Y-%m-%dT%H:%M:%S

    listener 1883
    protocol mqtt

    allow_anonymous false
    password_file /mosquitto/config/password.txt

    persistence true
    persistence_location /mosquitto/data/
  password.txt: |
    mqtt:$7$101$SCOHoQ4dnDcOJY+B$Yf6mm+znEKQaph/u+qczJolmQJCxX4qcOhpRhKUOu1mvT22BD9QJe+RzHlBURBobenGf/TMVYoD42nsVCO2mgA==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-conf
data:
  configuration.yaml: |
    version: 5
    mqtt:
      base_topic: zigbee2mqtt
      server: mqtt://mosquitto:1883
      user: "!secrets.yaml mqtt__user"
      password: "!secrets.yaml mqtt__password"
    serial:
      port: /dev/ttyUSB0
      adapter: zstack
    advanced:
      channel: 25
      network_key: "!secrets.yaml advanced__network_key"
      pan_id: 0x1FC8
      ext_pan_id: [111, 114, 103, 248, 53, 31, 139, 99]
    frontend:
      enabled: true
      url: https://z2m.ha.kalexlab.xyz
    homeassistant:
      enabled: true
    availability:
      enabled: true
    devices: devices.yaml
    groups: groups.yaml

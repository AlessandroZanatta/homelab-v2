---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: outline-ingress-certificate
spec:
  commonName: wiki.kalexlab.xyz
  secretName: outline-ingress-certificate-secret
  dnsNames:
    - wiki.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: outline-ingress
  annotations:
    external-dns.kubernetes.io/target: 192.168.10.20
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`wiki.kalexlab.xyz`)
      services:
        - name: outline
          port: 3000
  tls:
    secretName: outline-ingress-certificate-secret

---
apiVersion: v1
kind: Service
metadata:
  name: outline
  labels:
    kalexlab.xyz/app: wiki
    kalexlab.xyz/component: outline
spec:
  type: ClusterIP
  ports:
    - name: wiki
      port: 3000
      targetPort: outline
      protocol: TCP
  selector:
    kalexlab.xyz/app: wiki
    kalexlab.xyz/component: outline
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: outline
  labels:
    kalexlab.xyz/app: wiki
    kalexlab.xyz/component: outline
spec:
  serviceName: outline
  replicas: 1
  selector:
    matchLabels:
      kalexlab.xyz/app: wiki
      kalexlab.xyz/component: outline
  minReadySeconds: 5
  template:
    metadata:
      labels:
        kalexlab.xyz/app: wiki
        kalexlab.xyz/component: outline
        kalexlab.xyz/monitoring: "true"
    spec:
      restartPolicy: Always
      initContainers:
        - name: wait-deps
          image: "docker.io/library/alpine:3.23.4"
          imagePullPolicy: Always
          resources:
            requests:
              memory: 30Mi
              cpu: 1m
            limits:
              memory: 300Mi
              cpu: 20m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["sh", "-c", "for i in $(seq 1 300); do nc -zvw1 cache 6379 && nc -zvw1 cluster-rw 5432 && exit 0 || sleep 3; done; exit 1"]
      containers:
        - name: outline
          image: "docker.getoutline.com/outlinewiki/outline:1.8.1"
          imagePullPolicy: Always
          ports:
            - name: outline
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: outline-conf
            - secretRef:
                name: outline-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cluster-app
                  key: uri
          resources:
            requests:
              memory: 500Mi
              cpu: 50m
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_health
              port: outline
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_health
              port: outline
            failureThreshold: 3
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /data
              name: outline-data-pvc
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        fsGroup: 65535
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: outline-data-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

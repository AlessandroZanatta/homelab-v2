---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  labels:
    kalexlab.xyz/app: nextcloud
    kalexlab.xyz/component: nextcloud
  annotations:
    gatus.kalexlab.xyz/enabled: "true"
    gatus.kalexlab.xyz/scheme: http
    gatus.kalexlab.xyz/path: /status.php
    gatus.kalexlab.xyz/endpoint: |
      conditions:
        - "[STATUS] == 200"
        - "[BODY].maintenance == false"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    kalexlab.xyz/app: nextcloud
    kalexlab.xyz/component: nextcloud
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud
  labels:
    kalexlab.xyz/app: nextcloud
    kalexlab.xyz/component: nextcloud
spec:
  serviceName: nextcloud
  replicas: 1
  selector:
    matchLabels:
      kalexlab.xyz/app: nextcloud
      kalexlab.xyz/component: nextcloud
  minReadySeconds: 5
  template:
    metadata:
      labels:
        kalexlab.xyz/app: nextcloud
        kalexlab.xyz/component: nextcloud
        kalexlab.xyz/monitoring: "true"
        sso.kalexlab.xyz/idp: authentik
    spec:
      restartPolicy: Always
      initContainers:
        - name: copy-conf
          image: "docker.io/library/alpine:3.24.2"
          imagePullPolicy: Always
          resources:
            requests:
              memory: 30Mi
              cpu: 1m
            limits:
              memory: 300Mi
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Nextcloud persists the merged config (*.config.php included) in config.php,
          # so on every boot it is rebuilt keeping only the keys Nextcloud owns:
          #  - version
          command:
            - sh
            - -c
            - |
              set -e
              if [ -s /config-dir/config.php ]; then
                owned=$(grep -E "^  '(version)' => " /config-dir/config.php)
                printf '<?php\n$CONFIG = array (\n%s\n);\n' "$owned" > /config-dir/config.php
              else
                cp -L /config-map/config.php /config-dir/config.php
              fi
              find /config-dir -mindepth 1 -maxdepth 1 ! -name config.php -exec rm -rf {} +
              cp -L /config-map/*.config.php /config-dir/
          volumeMounts:
            - mountPath: /config-map
              name: nextcloud-conf
            - mountPath: /config-dir
              name: nextcloud-www-pvc
              subPath: config
        - name: wait-deps
          image: "docker.io/library/alpine:3.24.2"
          imagePullPolicy: Always
          resources:
            requests:
              memory: 30Mi
              cpu: 1m
            limits:
              memory: 300Mi
          securityContext:
            runAsUser: 65535
            runAsGroup: 65535
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 300); do
                nc -zvw1 cache 6379 && nc -zvw1 cluster-rw 5432 && exit 0 || sleep 3;
              done;
              exit 1
      containers:
        - name: nextcloud
          image: "docker.io/library/nextcloud:35.0.2-apache"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # Keep NEXTCLOUD_ADMIN_* env variables here,
            # even though they are only used on the initial setup
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_PASSWORD
            # Secrets go through NC_* env vars: Nextcloud reads them as system
            # config but never writes them to the persisted config.php
            - name: NC_secret
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: SECRET
            - name: NC_oidc_login_client_secret
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: OIDC_CLIENT_SECRET
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cluster-app
                  key: user
            - name: NC_dbpassword
              valueFrom:
                secretKeyRef:
                  name: cluster-app
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: cluster-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: cluster-app
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cluster-app
                  key: dbname
          resources:
            requests:
              memory: 200Mi
              cpu: 10m
            limits:
              memory: 2Gi

          livenessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: nextcloud.nextcloud.svc.cluster.local
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: nextcloud.nextcloud.svc.cluster.local
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/www/html
              name: nextcloud-www-pvc
            - mountPath: /var/www/html/data
              name: nextcloud-data-pvc
              subPath: data
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/run
              name: run
            - mountPath: /etc/nextcloud-app-conf
              name: nextcloud-app-conf
              readOnly: true
            - mountPath: /docker-entrypoint-hooks.d/before-starting
              name: nextcloud-hooks
              readOnly: true
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nextcloud-conf
          configMap:
            name: nextcloud-conf
        - name: nextcloud-app-conf
          configMap:
            name: nextcloud-app-conf
            items:
              - key: appconfig.json
                path: appconfig.json
        - name: nextcloud-hooks
          configMap:
            name: nextcloud-app-conf
            defaultMode: 0555
            items:
              - key: import-appconfig.sh
                path: import-appconfig.sh
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: run
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: nextcloud-data-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 100Gi
    - metadata:
        name: nextcloud-www-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

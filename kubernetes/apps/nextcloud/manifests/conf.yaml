---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collabora-online-conf
data:
  extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:mount_jail_tree=false --o:security.capabilities=false --o:net.frame_ancestors=cloud.kalexlab.xyz"
  server_name: collabora-online.kalexlab.xyz
  aliasgroup1: http://nextcloud
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-app-conf
data:
  appconfig.json: |
    {
      "apps": {
        "richdocuments": {
          "wopi_url": "http://collabora-online:9980",
          "public_wopi_url": "https://collabora-online.kalexlab.xyz",
          "wopi_callback_url": "http://nextcloud",
          "wopi_allowlist": "10.244.0.0/16"
        }
      }
    }
  import-appconfig.sh: |
    #!/bin/sh
    set -e
    php /var/www/html/occ config:import /etc/nextcloud-app-conf/appconfig.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-conf
data:
  config.php: |
    <?php

    $CONFIG = array (
      'version' => '35.0.1.1',
    );
  gitops.config.php: |
    <?php

    $CONFIG = array (
      'htaccess.RewriteBase' => '/',
      'apps_paths' =>
         array (
           0 =>
           array (
             'path' => '/var/www/html/apps',
             'url' => '/apps',
             'writable' => false,
           ),
           1 =>
           array (
             'path' => '/var/www/html/custom_apps',
             'url' => '/custom_apps',
             'writable' => true,
           ),
         ),
      'passwordsalt' => 'ThB9iKBy3lRGIbcYyNAI2pzglFhMpL',
      'trusted_domains' =>
        array (
          0 => 'localhost',
          1 => 'cloud.kalexlab.xyz',
          2 => 'nextcloud.nextcloud.svc.cluster.local',
          3 => 'nextcloud',
        ),
      'trusted_proxies' =>
        array (
          0 => '10.0.0.0/8',
        ),
      'allow_local_remote_servers' => true,
      'datadirectory' => '/var/www/html/data',
      'installed' => true,
      'instanceid' => 'oc7ql9mxohqu',
      'overwrite.cli.url' => 'https://cloud.kalexlab.xyz',
      'maintenance_window_start' => 1,
      'upgrade.disable-web' => true,
      'loglevel' => 0
    );
  redis.config.php: |
    <?php

    $CONFIG = array (
      'memcache.locking' => '\\OC\\Memcache\\Redis',
      'memcache.distributed' => '\\OC\\Memcache\\Redis',
      'memcache.local' => '\\OC\\Memcache\\APCu',
      'redis' =>
         array (
           'host' => 'cache',
           'port' => '6379',
         )
    );
  database.config.php: |
    <?php

    $CONFIG = array (
      'dbtype' => 'pgsql',
      'dbname' => getenv('POSTGRES_DB'),
      'dbhost' => getenv('POSTGRES_HOST'),
      'dbport' => getenv('POSTGRES_PORT'),
      'dbtableprefix' => 'oc_',
      'dbuser' => getenv('POSTGRES_USER')
    );
  oidc_provider_url.config.php: |
    <?php

    $CONFIG = array(
      'oidc_login_provider_url' => 'https://auth.kalexlab.xyz/application/o/apps-nextcloud/'
    );
  oidc.config.php: |
    <?php

    $CONFIG = array(
      'allow_user_to_change_display_name' => false,
      'lost_password_link' => 'disabled',
      'oidc_login_client_id' => 'apps-nextcloud',
      'oidc_login_auto_redirect' => true,
      'oidc_login_end_session_redirect' => false,
      'oidc_login_button_text' => 'Log in with Authentik',
      'oidc_login_hide_password_form' => true,
      'oidc_login_attributes' => array (
          'id' => 'preferred_username',
          'name' => 'name',
          'mail' => 'email',
          'groups' => 'groups',
          'is_admin' => 'nextcloud_admin',
      ),
      'oidc_login_default_group' => 'oidc',
      'oidc_login_use_external_storage' => false,
      'oidc_login_scope' => 'openid profile email nextcloud_role',
      'oidc_login_proxy_ldap' => false,
      'oidc_login_disable_registration' => true,
      'oidc_login_redir_fallback' => false,
      'oidc_login_tls_verify' => true,
      'oidc_create_groups' => false,
      'oidc_login_webdav_enabled' => false,
      'oidc_login_password_authentication' => false,
      'oidc_login_public_key_caching_time' => 86400,
      'oidc_login_min_time_between_jwks_requests' => 10,
      'oidc_login_well_known_caching_time' => 86400,
      'oidc_login_update_avatar' => false,
      'oidc_login_code_challenge_method' => 'S256'
    );

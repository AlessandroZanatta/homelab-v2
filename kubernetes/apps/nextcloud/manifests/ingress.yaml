---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nextcloud-certificate
spec:
  commonName: cloud.kalexlab.xyz
  secretName: nextcloud-ingress-certificate-secret
  dnsNames:
    - cloud.kalexlab.xyz
    - collabora-online.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-ingress
  annotations:
    external-dns.kubernetes.io/target: 10.20.0.20
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`cloud.kalexlab.xyz`)
      services:
        - name: nextcloud
          port: http
  tls:
    secretName: nextcloud-ingress-certificate-secret
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collabora-online-ingress
  annotations:
    external-dns.kubernetes.io/target: 10.20.0.20
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`collabora-online.kalexlab.xyz`)
      services:
        - name: collabora-online
          port: http
  tls:
    secretName: nextcloud-ingress-certificate-secret

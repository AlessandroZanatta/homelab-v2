---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cluster-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coredns
          podSelector:
            matchLabels:
              k8s-app: coredns
      ports:
        - protocol: UDP
          port: udp-53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud
spec:
  podSelector:
    matchLabels:
      kalexlab.xyz/app: nextcloud
      kalexlab.xyz/component: nextcloud
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: nextcloud
              kalexlab.xyz/component: webcron
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: nextcloud
              kalexlab.xyz/component: collabora-online
      ports:
        - protocol: TCP
          port: http
  egress:
    - to:
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: nextcloud
              kalexlab.xyz/component: cluster
      ports:
        - protocol: TCP
          port: postgresql
    - to:
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: nextcloud
              kalexlab.xyz/component: cache
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: nextcloud
              kalexlab.xyz/component: collabora-online
      ports:
        - protocol: TCP
          port: http
---

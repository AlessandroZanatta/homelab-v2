---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: objects
spec:
  commonName: obj.kalexlab.xyz
  secretName: objects-certificate
  dnsNames:
    - obj.kalexlab.xyz
    - ui.obj.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: objects
  annotations:
    external-dns.kubernetes.io/target: 10.20.0.20
    # S3 returns 403 on a call without credentials
    gatus.kalexlab.xyz/endpoint: |
      conditions:
        - "[STATUS] == any(200,401,403)"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`obj.kalexlab.xyz`)
      services:
        - name: objects-s3
          port: s3-http
    - kind: Rule
      match: Host(`ui.obj.kalexlab.xyz`)
      services:
        - name: objects-admin
          port: admin-http
      middlewares:
        - name: authentik-forward-auth
          namespace: authentik
  tls:
    secretName: objects-certificate

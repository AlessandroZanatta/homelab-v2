---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: tofu
spec:
  clusterRef:
    name: objects
    namespace: objects
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: BucketLifecyclePolicy
metadata:
  name: cleanup-uploads
spec:
  bucketRef:
    name: tofu
  rules:
    - id: cleanup-incomplete-uploads
      status: Enabled
      abortIncompleteMultipartUpload:
        daysAfterInitiation: 7

---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
spec:
  inheritMetadata:
    labels:
      kalexlab.xyz/app: plants
      kalexlab.xyz/component: mariadb
      kalexlab.xyz/monitoring: "true"
      backups.kalexlab.xyz/use: "true"
    annotations:
      gatus.kalexlab.xyz/enabled: "true"
      gatus.kalexlab.xyz/scheme: tcp

  # renovate: datasource=docker depName=ghcr.io/mariadb/mariadb
  image: ghcr.io/mariadb/mariadb:13.0.2
  imagePullPolicy: Always
  replicas: 1

  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: password
    generate: false

  database: app
  username: app
  passwordSecretKeyRef:
    name: mariadb-app
    key: password
    generate: false

  port: 3306

  storage:
    size: 3Gi

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  resources:
    requests:
      cpu: 100m
      memory: 250Mi
    limits:
      memory: 750Mi

  metrics:
    enabled: true
    passwordSecretKeyRef:
      name: mariadb-metrics
      key: password
      generate: false
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: PhysicalBackup
metadata:
  name: mariadb-backup
spec:
  inheritMetadata:
    labels:
      kalexlab.xyz/app: plants
      kalexlab.xyz/component: mariadb-backup
      backups.kalexlab.xyz/use: "true"
  mariaDbRef:
    name: mariadb
    waitForIt: true
  storage:
    s3:
      endpoint: backups.kalexlab.xyz
      bucket: mariadb
      # renovate-major: depName=ghcr.io/mariadb/mariadb
      prefix: plants/full/mariadb-13
      accessKeyIdSecretKeyRef:
        name: plants-s3-credentials
        key: accessKey
      secretAccessKeySecretKeyRef:
        name: plants-s3-credentials
        key: secretKey
      tls:
        enabled: true
  schedule:
    cron: "0 0 * * *"
    suspend: false
    immediate: true
    onDemand: "1"
  compression: bzip2
  maxRetention: 336h # 14d
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: PointInTimeRecovery
metadata:
  name: mariadb-backup
spec:
  physicalBackupRef:
    name: mariadb-backup
  storage:
    s3:
      endpoint: backups.kalexlab.xyz
      bucket: mariadb
      # renovate-major: depName=ghcr.io/mariadb/mariadb
      prefix: plants/pitr/mariadb-13
      accessKeyIdSecretKeyRef:
        name: plants-s3-credentials
        key: accessKey
      secretAccessKeySecretKeyRef:
        name: plants-s3-credentials
        key: secretKey
      tls:
        enabled: true
  compression: bzip2
  archiveTimeout: 1h
  strictMode: false

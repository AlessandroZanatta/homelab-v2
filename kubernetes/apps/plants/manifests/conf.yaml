---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hortusfox-conf
data:
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_DATABASE: app
  DB_USERNAME: app
  DB_CHARSET: utf8mb4
  APP_UPDATEDEPS: "false"
  PROXY_ENABLE: "true"
  PROXY_HEADER_EMAIL: X-authentik-email
  PROXY_HEADER_USERNAME: X-authentik-username
  PROXY_AUTO_SIGNUP: "true"
  PROXY_HIDE_LOGOUT: "true"
  PROXY_OVERWRITE_VALUES: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-notifier-conf
data:
  HORTUSFOX_URL: http://hortusfox
  PUBLIC_URL: https://plants.kalexlab.xyz
  PYTHONDONTWRITEBYTECODE: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-notifier-script
data:
  notify.py: |
    import json
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request
    from datetime import date, datetime, time, timedelta
    from html import escape

    # Must match TasksModel::$scope_quantities in HortusFox
    SCOPE_HOURS = {"hours": 1, "days": 24, "weeks": 168, "months": 672, "years": 8760}

    def request(url, data=None):
        body = urllib.parse.urlencode(data).encode() if data else None
        with urllib.request.urlopen(url, data=body, timeout=30) as resp:
            return json.load(resp)

    def api(path, **params):
        query = urllib.parse.urlencode({"token": api_token, **params})
        resp = request(f"{hortusfox_url}/api/{path}?{query}")
        if resp.get("code") != 200:
            raise RuntimeError(f"HortusFox API {path} returned code {resp.get('code')}")
        return resp

    hortusfox_url = os.environ["HORTUSFOX_URL"]
    public_url = os.environ["PUBLIC_URL"]
    api_token = os.environ["HORTUSFOX_API_TOKEN"]
    bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
    chat_ids = [c.strip() for c in os.environ.get("TELEGRAM_CHAT_IDS", "").split(",") if c.strip()]
    if not chat_ids:
        sys.exit("TELEGRAM_CHAT_IDS is empty")

    failed = 0

    # HortusFox only reschedules recurring tasks regardless of completion and
    # never reopens done ones, so reopen them here once someone completes them.
    # It stores no completion time: morning runs assume the task was done after
    # the previous evening's run.
    try:
        done_tasks = api("tasks/fetch", done=1, limit=1000).get("data") or []
        open_tasks = api("tasks/fetch", done=0, limit=1000).get("data") or []
    except (urllib.error.URLError, RuntimeError) as e:
        sys.exit(f"Fetching tasks failed: {e}")

    now = datetime.now()
    completed_on = datetime.combine(now.date() - timedelta(days=1 if now.hour < 12 else 0), time())
    for t in done_tasks:
        if not t.get("recurring_time"):
            continue
        hours = int(t["recurring_time"])
        scope = t.get("recurring_scope")
        if scope not in SCOPE_HOURS or hours % SCOPE_HOURS[scope]:
            scope = "hours"
        due_date = (completed_on + timedelta(hours=hours)).date().isoformat()
        try:
            # editTask converts recurring_time from scope units to hours again
            api(
                "tasks/edit",
                task=t["id"],
                done=0,
                due_date=due_date,
                recurring_time=hours // SCOPE_HOURS[scope],
                recurring_scope=scope,
            )
            print(f"Reopened recurring task {t['id']}, next due {due_date}")
        except (urllib.error.URLError, RuntimeError) as e:
            print(f"Reopening task {t['id']} failed: {e}", file=sys.stderr)
            failed += 1

    today = date.today().isoformat()
    due = sorted(
        (t for t in open_tasks if t.get("due_date") and t["due_date"][:10] <= today),
        key=lambda t: t["due_date"],
    )

    if due:
        lines = ["🌱 <b>Plant tasks due</b>", ""]
        for t in due:
            day = t["due_date"][:10]
            marker = "⚠️" if day < today else "•"
            lines.append(f"{marker} <b>{escape(t['title'])}</b> ({'today' if day == today else day})")
        lines += ["", f'<a href="{public_url}/tasks">Open tasks</a>']
        text = "\n".join(lines)

        for chat_id in chat_ids:
            try:
                request(
                    f"https://api.telegram.org/bot{bot_token}/sendMessage",
                    {"chat_id": chat_id, "text": text, "parse_mode": "HTML", "disable_web_page_preview": "true"},
                )
            except urllib.error.HTTPError as e:
                print(f"Telegram sendMessage to chat {chat_id} failed: HTTP {e.code}", file=sys.stderr)
                failed += 1
        print(f"Sent {len(due)} due tasks to {len(chat_ids) - failed}/{len(chat_ids)} chats")
    else:
        print("No tasks due")

    sys.exit(1 if failed else 0)

---
global:
  # -- Toggle and define pod-level security context.
  # @default -- `{}` (See [values.yaml])
  securityContext:
    runAsNonRoot: true
    runAsUser: 65535
    runAsGroup: 65535
    fsGroup: 65535
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault

  # Default affinity preset for all components
  affinity:
    # -- Default pod anti-affinity rules. Either: `none`, `soft` or `hard`
    podAntiAffinity: none
    # Node affinity rules
    nodeAffinity:
      # -- Default node affinity rules. Either `none`, `soft` or `hard`
      type: none

  # -- Deployment strategy for all deployed Deployments
  # maxSurge=25%, maxUnavailable=75% to recreate one by one
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 75%

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

  # -- Additional volumeMounts to all deployed Deployments. Does not apply to GeoIP
  # @default -- `[]` (See [values.yaml])
  volumeMounts:
    - name: secret-key
      mountPath: /secrets/secret-key
    - name: cnpg-cluster
      mountPath: /secrets/postgres
    - name: blueprints-default-override
      mountPath: /blueprints/default

  # -- Additional volumes to all deployed Deployments.
  # @default -- `[]` (See [values.yaml])
  volumes:
    - name: secret-key
      secret:
        secretName: secret-key
    - name: cnpg-cluster
      secret:
        secretName: cluster-app
    - name: blueprints-default-override
      emptyDir: {}

  envFrom:
    - secretRef:
        name: bootstrap

# -- Authentik configuration. See the [authentik configuration docs] for details about which values are accepted here. See the note at the top of that page for details about transforming environment variable names into values here.
# @default -- See [values.yaml]
authentik:
  # -- Log level for server and worker
  log_level: info
  # -- Secret key used for cookie singing and unique user IDs,
  # don't change this after the first install
  secret_key: "file:///secrets/secret-key/key"
  # bootstrap_email: "file:///secrets/bootstrap/email"
  # bootstrap_password: "file:///secrets/bootstrap/password"
  # bootstrap_token: "file:///secrets/bootstrap/token"
  web:
    base_url: "https://auth.kalexlab.xyz"

  outposts:
    # The embedded outpost is created and owned by authentik itself, which makes
    # it a poor fit for tofu: adopting it needs a data source plus an import
    # block, and `tofu destroy` then deletes an object authentik expects to own.
    # Disabling it lets the outpost be declared as an ordinary resource instead,
    # so destroy and apply stay repeatable. authentik actively keeps the embedded
    # outpost deleted while this is true.
    disable_embedded_outpost: true

  postgresql:
    # -- set the postgresql hostname to talk to
    # if unset and .Values.postgresql.enabled == true, will generate the default
    # @default -- `{{ .Release.Name }}-postgresql`
    host: "file:///secrets/postgres/host"
    # -- postgresql Database name
    # @default -- `authentik`
    name: "file:///secrets/postgres/dbname"
    # -- postgresql Username
    # @default -- `authentik`
    user: "file:///secrets/postgres/username"
    # -- postgresql password
    password: "file:///secrets/postgres/password"
    # -- postgresql port
    port: 5432

## authentik server
server:
  # -- The number of server pods to run
  replicas: 2

  ## authentik server Pod Disruption Budget
  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  pdb:
    # -- Deploy a [PodDistrubtionBudget] for the authentik server
    enabled: true
    # -- Number of pods that are available after eviction as number or percentage (eg.: 50%)
    # @default -- `""` (defaults to 0 if not specified)
    minAvailable: "1"

  # -- Resource limits and requests for the authentik server
  resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 512Mi
  # limits:
  #   memory: 512Mi

  # -- authentik server container-level security context
  # @default -- See [values.yaml]
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  ## authentik server metrics service configuration
  metrics:
    # -- deploy metrics service
    enabled: true
    serviceMonitor:
      # -- enable a prometheus ServiceMonitor
      enabled: true

  volumeMounts:
    - mountPath: /data
      name: authentik-data-pvc

  volumes:
    - name: authentik-data-pvc
      persistentVolumeClaim:
        claimName: authentik-data-pvc

## authentik worker
worker:
  # -- The number of worker pods to run
  replicas: 2

  ## authentik worker Pod Disruption Budget
  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  pdb:
    # -- Deploy a [PodDistrubtionBudget] for the authentik worker
    enabled: true
    # -- Number of pods that are available after eviction as number or percentage (eg.: 50%)
    # @default -- `""` (defaults to 0 if not specified)
    minAvailable: "1"

  # -- authentik worker container-level security context
  # @default -- See [values.yaml]
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  ## authentik worker metrics service configuration
  metrics:
    # -- deploy metrics service
    enabled: true
    serviceMonitor:
      # -- enable a prometheus ServiceMonitor
      enabled: true

prometheus:
  rules:
    enabled: true

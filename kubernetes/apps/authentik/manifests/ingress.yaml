---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik
spec:
  commonName: auth.kalexlab.xyz
  secretName: authentik-certificate
  dnsNames:
    - auth.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  annotations:
    external-dns.kubernetes.io/target: ingress.kalexlab.xyz
    gatus.kalexlab.xyz/exclude-route: /if/admin
spec:
  entryPoints:
    - web-public
    - websecure-public
  routes:
    - kind: Rule
      match: Host(`auth.kalexlab.xyz`)
      services:
        - name: authentik-server
          port: http
    - kind: Rule
      match: Host(`auth.kalexlab.xyz`) && PathPrefix(`/if/admin`)
      services:
        - name: authentik-server
          port: http
      middlewares:
        - name: allow-internal-only
          namespace: traefik
  tls:
    secretName: authentik-certificate

---
apiVersion: kro.run/v1alpha1
kind: BarmanClusterBackup
metadata:
  name: cluster-backup
spec:
  name: authentik
  clusterName: cluster
  destinationFolder: authentik
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster
spec:
  inheritedMetadata:
    labels:
      kalexlab.xyz/app: authentik
      kalexlab.xyz/component: cluster
      kalexlab.xyz/monitoring: "true"
      backups.kalexlab.xyz/use: "true"
    annotations:
      gatus.kalexlab.xyz/enabled: "true"
      gatus.kalexlab.xyz/scheme: tcp
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
  instances: 2
  # Required, otherwise primary instance is upgraded in-place (without a switchover)
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    storageClass: longhorn-single-replica
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik
        # renovate-major: depName=ghcr.io/cloudnative-pg/postgresql
        serverName: cluster-v18
  affinity:
    enablePodAntiAffinity: false
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql

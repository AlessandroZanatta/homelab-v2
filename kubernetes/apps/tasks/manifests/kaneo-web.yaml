---
apiVersion: v1
kind: Service
metadata:
  name: kaneo-web
  labels:
    kalexlab.xyz/app: tasks
    kalexlab.xyz/component: kaneo-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5173
      targetPort: http
      protocol: TCP
  selector:
    kalexlab.xyz/app: tasks
    kalexlab.xyz/component: kaneo-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo-web
  labels:
    kalexlab.xyz/app: tasks
    kalexlab.xyz/component: kaneo-web
spec:
  replicas: 1
  selector:
    matchLabels:
      kalexlab.xyz/app: tasks
      kalexlab.xyz/component: kaneo-web
  minReadySeconds: 5
  template:
    metadata:
      labels:
        kalexlab.xyz/app: tasks
        kalexlab.xyz/component: kaneo-web
        kalexlab.xyz/monitoring: "true"
    spec:
      restartPolicy: Always
      containers:
        - name: app
          image: "ghcr.io/usekaneo/web:2.47.0"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kaneo-conf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 20Mi
              cpu: 1m
            limits:
              memory: 50Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            periodSeconds: 30
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/lib/kaneo
              name: kaneo
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        fsGroup: 65535
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: kaneo
          emptyDir:
            sizeLimit: 1Gi

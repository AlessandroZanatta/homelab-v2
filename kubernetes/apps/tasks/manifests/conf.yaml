---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kaneo-conf
data:
  KANEO_API_URL: "https://tasks.kalexlab.xyz"
  KANEO_CLIENT_URL: "https://tasks.kalexlab.xyz"
  CUSTOM_OAUTH_CLIENT_ID: apps-kaneo
  CUSTOM_OAUTH_DISCOVERY_URL: https://auth.kalexlab.xyz/application/o/apps-kaneo/.well-known/openid-configuration
  CUSTOM_OAUTH_SCOPES: openid,profile,email
  CUSTOM_AUTH_PKCE: "true"
  DISABLE_REGISTRATION: "true"
  DISABLE_GUEST_ACCESS: "true"

---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    kalexlab.xyz/app: reciept
    kalexlab.xyz/component: api
    kalexlab.xyz/monitoring: "true"
  annotations:
    gatus.kalexlab.xyz/enabled: "true"
    gatus.kalexlab.xyz/path: /api/health
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: http
  selector:
    kalexlab.xyz/app: reciept
    kalexlab.xyz/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    kalexlab.xyz/app: reciept
    kalexlab.xyz/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      kalexlab.xyz/app: reciept
      kalexlab.xyz/component: api
  minReadySeconds: 5
  template:
    metadata:
      labels:
        kalexlab.xyz/app: reciept
        kalexlab.xyz/component: api
        kalexlab.xyz/monitoring: "true"
        sso.kalexlab.xyz/idp: authentik
    spec:
      restartPolicy: Always
      imagePullSecrets:
        - name: registry-credentials
      initContainers:
        - name: wait-deps
          image: "docker.io/library/alpine:3.24.2"
          imagePullPolicy: Always
          resources:
            requests:
              memory: 30Mi
              cpu: 1m
            limits:
              memory: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            [
              "sh",
              "-c",
              "for i in $(seq 1 300); do nc -zvw1 cluster-rw 5432 && exit 0 || sleep 3; done; exit 1",
            ]
      containers:
        - name: api
          image: "registry.kalexlab.xyz/reciept/api:latest"
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: reciept-secrets
          env:
            - name: CONFIG_PATH
              value: /config.yaml
            - name: DATABASE__URI
              valueFrom:
                secretKeyRef:
                  name: cluster-app
                  key: uri
          resources:
            requests:
              memory: 100Mi
              cpu: 5m
            limits:
              memory: 400Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 3
            periodSeconds: 30
          volumeMounts:
            - mountPath: /uploads
              name: reciept-data-pvc
            - mountPath: /config.yaml
              subPath: config.yaml
              name: reciept-conf
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        fsGroup: 65535
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: reciept-conf
          configMap:
            name: reciept-conf
        - name: reciept-data-pvc
          persistentVolumeClaim:
            claimName: reciept-data-pvc

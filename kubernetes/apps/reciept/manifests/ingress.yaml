---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: reciept-certificate
spec:
  commonName: recipes.kalexlab.xyz
  secretName: reciept-ingress-certificate
  dnsNames:
    - recipes.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: reciept-ingress
  annotations:
    external-dns.kubernetes.io/target: 192.168.10.20
    gatus.kalexlab.xyz/path: /
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: "Host(`recipes.kalexlab.xyz`) && PathPrefix(`/api`)"
      services:
        - name: api
          port: http
    - kind: Rule
      match: "Host(`recipes.kalexlab.xyz`)"
      services:
        - name: web
          port: http
  tls:
    secretName: reciept-ingress-certificate

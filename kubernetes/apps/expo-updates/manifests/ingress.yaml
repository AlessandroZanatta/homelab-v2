---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: expo-updates
spec:
  commonName: expo-ota.kalexlab.xyz
  secretName: expo-updates-ingress-certificate
  dnsNames:
    - expo-ota.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: expo-updates
  annotations:
    external-dns.kubernetes.io/target: 192.168.10.20
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`expo-ota.kalexlab.xyz`)
      services:
        - name: xprem
          port: http
  tls:
    secretName: expo-updates-ingress-certificate

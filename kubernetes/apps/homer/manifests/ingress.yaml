---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homer-certificate
spec:
  commonName: homer.kalexlab.xyz
  secretName: homer-ingress-certificate-secret
  dnsNames:
    - homer.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homer-ingress
  annotations:
    external-dns.kubernetes.io/target: 192.168.10.20
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # No need to add forward-auth to homer
    - kind: Rule
      match: Host(`homer.kalexlab.xyz`)
      services:
        - name: homer
          port: 8080
  tls:
    secretName: homer-ingress-certificate-secret

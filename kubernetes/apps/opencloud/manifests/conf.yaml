---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-conf
data:
  OC_URL: https://drive.kalexlab.xyz
  OC_INSECURE: "false"
  PROXY_TLS: "false"
  # Used for probes
  PROXY_DEBUG_ADDR: 0.0.0.0:9205
  # Disable embedded IDP
  OC_EXCLUDE_RUN_SERVICES: idp
  # Run the WOPI connector for Collabora inside the main process
  OC_ADD_RUN_SERVICES: collaboration,auth-app
  PROXY_ENABLE_APP_AUTH: "true"

  # OIDC
  OC_OIDC_ISSUER: https://auth.kalexlab.xyz/application/o/apps-opencloud/
  OC_OIDC_CLIENT_ID: apps-opencloud
  PROXY_OIDC_REWRITE_WELLKNOWN: "true"
  PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: jwt
  PROXY_OIDC_AUDIENCES: apps-opencloud

  PROXY_AUTOPROVISION_ACCOUNTS: "true"
  PROXY_USER_OIDC_CLAIM: preferred_username
  PROXY_USER_CS3_CLAIM: username
  PROXY_AUTOPROVISION_CLAIM_USERNAME: preferred_username
  PROXY_AUTOPROVISION_CLAIM_EMAIL: email
  PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME: name
  PROXY_AUTOPROVISION_CLAIM_GROUPS: groups
  PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
  GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"

  PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml

  # Collabora
  COLLABORATION_APP_NAME: CollaboraOnline
  COLLABORATION_APP_PRODUCT: Collabora
  COLLABORATION_APP_ADDR: http://collabora-online:9980
  COLLABORATION_APP_ICON: https://docs.kalexlab.xyz/favicon.ico
  COLLABORATION_WOPI_SRC: http://opencloud:9200
  # TODO: investigate why proofs break collabora integration
  COLLABORATION_APP_PROOF_DISABLE: "true"
  FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR: eu.opencloud.api.collaboration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-files
data:
  proxy.yaml: |
    role_assignment:
      driver: oidc
      oidc_role_mapper:
        role_claim: groups
        # First match wins: keep higher-privilege roles first
        role_mapping:
          - role_name: admin
            claim_value: infra
          - role_name: user
            claim_value: home
          - role_name: user
            claim_value: family
  # Replaces the built-in mimetype list
  app-registry.yaml: |
    app_registry:
      mimetypes:
        - mime_type: application/pdf
          extension: pdf
          name: PDF
          description: PDF document
        - mime_type: application/vnd.oasis.opendocument.text
          extension: odt
          name: Document
          description: OpenDocument text document
          allow_creation: true
        - mime_type: application/vnd.oasis.opendocument.spreadsheet
          extension: ods
          name: Spreadsheet
          description: OpenDocument spreadsheet document
          allow_creation: true
        - mime_type: application/vnd.oasis.opendocument.presentation
          extension: odp
          name: Presentation
          description: OpenDocument presentation document
          allow_creation: true
        - mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
          extension: docx
          name: Microsoft Word
          description: Microsoft Word document
          allow_creation: true
        - mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.form
          extension: docxf
          name: Form Document
          description: Form Document
        - mime_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          extension: xlsx
          name: Microsoft Excel
          description: Microsoft Excel document
          allow_creation: true
        - mime_type: application/vnd.openxmlformats-officedocument.presentationml.presentation
          extension: pptx
          name: Microsoft PowerPoint
          description: Microsoft PowerPoint document
          allow_creation: true
        - mime_type: application/vnd.jupyter
          extension: ipynb
          name: Jupyter Notebook
          description: Jupyter Notebook
        - mime_type: text/markdown
          extension: md
          name: Markdown file
          description: Markdown file
          allow_creation: true
        - mime_type: application/compressed-markdown
          extension: zmd
          name: Compressed markdown file
          description: Compressed markdown file
        - mime_type: application/vnd.geogebra.slides
          extension: ggs
          name: GeoGebra Slides
          description: GeoGebra Slides
  csp.yaml: |
    directives:
      connect-src:
        - 'https://auth.kalexlab.xyz/'
      frame-src:
        - 'https://auth.kalexlab.xyz/'
        - 'https://docs.kalexlab.xyz/'
      img-src:
        - 'https://docs.kalexlab.xyz/'
      worker-src:
        - '''self'''
        - 'blob:'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collabora-online-conf
data:
  extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:mount_jail_tree=false --o:security.capabilities=false --o:welcome.enable=false --o:net.frame_ancestors=drive.kalexlab.xyz"
  server_name: docs.kalexlab.xyz
  aliasgroup1: http://opencloud:9200

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - network-policies.yaml
  - conf.yaml
  - cache.yaml
  - blocky.yaml
  - service-monitor.yaml
  - pdb.yaml
  - dashboards.yaml

configMapGenerator:
  - name: blocky-queries-dashboard
    files:
      - dashboards/blocky-queries.json
    options:
      disableNameSuffixHash: true

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-ingress-certificate
spec:
  commonName: vault.kalexlab.xyz
  secretName: vaultwarden-ingress-certificate-secret
  dnsNames:
    - vault.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden-ingress
  annotations:
    external-dns.kubernetes.io/target: 192.168.10.20
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`vault.kalexlab.xyz`)
      services:
        - name: vaultwarden
          port: 8080
  tls:
    secretName: vaultwarden-ingress-certificate-secret

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kro-system

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: kro
    repo: oci://registry.k8s.io/kro/charts
    version: 0.10.0
    releaseName: kro
    namespace: kro-system
    valuesFile: values/kro.yaml

resources:
  - manifests

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8tz

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: k8tz
    repo: https://k8tz.github.io/k8tz/
    version: 0.20.0
    releaseName: k8tz
    namespace: k8tz
    valuesFile: values/k8tz.yaml

resources:
  - manifests

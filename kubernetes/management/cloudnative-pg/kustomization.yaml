---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cnpg-system

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.0
    releaseName: cloudnative-pg
    namespace: cnpg-system
    valuesFile: values/cloudnative-pg.yaml

resources:
  - manifests
  - https://github.com/cloudnative-pg/plugin-barman-cloud//kubernetes?ref=v0.14.0

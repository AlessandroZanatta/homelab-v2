---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.7.1
    releaseName: argocd
    namespace: argocd
    valuesFile: values/argocd.yaml

resources:
  - manifests

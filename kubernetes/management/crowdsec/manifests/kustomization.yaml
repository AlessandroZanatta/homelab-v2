---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - network-policies.yaml
  - secrets.sops.yaml
  - cluster.yaml
  - cluster-backup.yaml
  - pdbs.yaml
  - rbac.yaml
  - machines-prune.yaml
  - dashboards.yaml
configMapGenerator:
  - name: crowdsec-metrics-dashboard
    files:
      - dashboards/crowdsec-metrics.json
    options:
      # GrafanaDashboard configMapRef isn't rewritten by kustomize
      disableNameSuffixHash: true

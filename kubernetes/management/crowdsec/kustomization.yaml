---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crowdsec

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.2
    releaseName: crowdsec
    namespace: crowdsec
    valuesFile: values/crowdsec.yaml

resources:
  - manifests

patches:
  - target:
      kind: ^(ServiceAccount|Role|RoleBinding|ConfigMap|Service|Deployment|Pod|DaemonSet|Job)$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: crowdsec
  - target:
      kind: Pod
      name: crowdsec-test-.*
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata:
        name: crowdsec-test

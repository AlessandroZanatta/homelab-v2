---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cilium

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.19.5
    releaseName: cilium
    namespace: cilium
    valuesFile: values/cilium.yaml

resources:
  - manifests

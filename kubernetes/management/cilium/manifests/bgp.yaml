---
# BGP peering with the OpenWrt router (bird2, openwrt/files/etc/bird.conf).
#   ref: https://docs.cilium.io/en/stable/network/bgp-control-plane/bgp-control-plane-v2/
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: openwrt
spec:
  bgpInstances:
    - name: homelab
      localASN: 64512
      peers:
        - name: openwrt
          peerASN: 64513
          peerAddress: 192.168.20.1
          peerConfigRef:
            name: openwrt
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: openwrt
spec:
  # Must match bird.conf
  timers:
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          kalexlab.xyz/bgp-advertisement: lb-vips
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: lb-vips
  labels:
    kalexlab.xyz/bgp-advertisement: lb-vips
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      # Advertise every LoadBalancer service unless explicitly opted out
      selector:
        matchExpressions:
          - key: kalexlab.xyz/no-bgp
            operator: DoesNotExist

---
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-traefik
spec:
  blocks:
    - cidr: "192.168.10.20/32"
  serviceSelector:
    matchLabels:
      kalexlab.xyz/ip-pool: traefik
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2policy-traefik
spec:
  loadBalancerIPs: true
  serviceSelector:
    matchLabels:
      kalexlab.xyz/ip-pool: traefik
  nodeSelector:
    matchLabels:
      ingress.kalexlab.xyz/enabled: "true"
      ingress.kalexlab.xyz/type: traefik
---
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-traefik-public
spec:
  blocks:
    - cidr: "192.168.10.22/32"
  serviceSelector:
    matchLabels:
      kalexlab.xyz/ip-pool: traefik-public
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2policy-traefik-public
spec:
  loadBalancerIPs: true
  serviceSelector:
    matchLabels:
      kalexlab.xyz/ip-pool: traefik-public
  nodeSelector:
    matchLabels:
      ingress.kalexlab.xyz/enabled: "true"
      ingress.kalexlab.xyz/type: traefik

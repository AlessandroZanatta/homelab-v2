---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn
spec:
  commonName: longhorn.kalexlab.xyz
  secretName: longhorn-ingress-certificate
  dnsNames:
    - longhorn.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  annotations:
    external-dns.alpha.kubernetes.io/target: 192.168.10.20
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`longhorn.kalexlab.xyz`)
      services:
        - name: longhorn-frontend
          port: 80
      middlewares:
        - name: authelia-forward-auth
          namespace: sso
  tls:
    secretName: longhorn-ingress-certificate

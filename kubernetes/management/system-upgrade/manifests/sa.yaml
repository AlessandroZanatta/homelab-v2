---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuppr-cnpg-maintenance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuppr-cnpg-maintenance
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuppr-cnpg-maintenance
subjects:
  - kind: ServiceAccount
    name: tuppr-cnpg-maintenance
    namespace: system-upgrade
roleRef:
  kind: ClusterRole
  name: tuppr-cnpg-maintenance
  apiGroup: rbac.authorization.k8s.io

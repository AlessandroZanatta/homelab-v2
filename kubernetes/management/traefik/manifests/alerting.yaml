---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: traefik-alerts
spec:
  groups:
    - name: traefik.rules
      rules:
        - alert: TraefikServiceDown
          expr: sum by (service) (traefik_service_server_up) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Traefik service {{ $labels.service }} has no healthy backends
            description: "All backend servers of {{ $labels.service }} are down\n  LABELS = {{ $labels }}"
        - alert: TraefikHigh5xxErrorRate
          # Only 5xx
          expr: |
            sum by (service) (rate(traefik_service_requests_total{code=~"5..", service!~".*@internal"}[10m]))
              / sum by (service) (rate(traefik_service_requests_total{service!~".*@internal"}[10m])) > 0.05
            and sum by (service) (increase(traefik_service_requests_total{code=~"5..", service!~".*@internal"}[10m])) >= 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Traefik service {{ $labels.service }} 5xx error rate is {{ $value | humanizePercentage }}
            description: "More than 5% of requests (and at least 5) returned 5xx in the last 10m\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.4.0
    releaseName: traefik
    namespace: traefik
    valuesFile: values/traefik.yaml

resources:
  - manifests

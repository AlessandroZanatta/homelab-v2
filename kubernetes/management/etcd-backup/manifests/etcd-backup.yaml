---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            kalexlab.xyz/app: etcd-backup
            kalexlab.xyz/monitoring: "true"
            backups.kalexlab.xyz/use: "true"
        spec:
          restartPolicy: Never
          containers:
            - name: etcd-backup
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3-10-gb9fd478
              workingDir: /tmp
              imagePullPolicy: Always

              envFrom:
                - configMapRef:
                    name: etcd-backup-conf

              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-s3-credentials
                      key: accessKey
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-s3-credentials
                      key: secretKey

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /.talos
                  name: talos
                - mountPath: /var/run/secrets/talos.dev
                  name: talos-secrets

          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65535
            runAsGroup: 65535
            fsGroup: 65535
            fsGroupChangePolicy: "OnRootMismatch"
            seccompProfile:
              type: RuntimeDefault

          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: talos
              emptyDir:
                sizeLimit: 1Gi
            - name: talos-secrets
              secret:
                secretName: talos-backup-secrets

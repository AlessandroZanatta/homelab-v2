---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mariadb-operator

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: mariadb-operator
    repo: oci://ghcr.io/mariadb-operator/charts
    version: 26.10.1
    releaseName: mariadb-operator
    namespace: mariadb-operator
    valuesFile: values/mariadb-operator.yaml

resources:
  - manifests

patches:
  - target:
      kind: ^(ServiceAccount|Role|RoleBinding|ConfigMap|Service|Deployment)$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: mariadb-operator

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: coredns

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: coredns
    repo: https://coredns.github.io/helm
    version: 1.46.0
    releaseName: coredns
    namespace: coredns
    valuesFile: values/coredns.yaml

resources:
  - manifests

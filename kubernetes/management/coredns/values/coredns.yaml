---
replicaCount: 2

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    # Intentionally empty to unset it
    cpu:
    memory: 128Mi

prometheus:
  service:
    enabled: true
  monitor:
    enabled: true

service:
  clusterIP: "10.96.0.10"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: coredns

podDisruptionBudget:
  minAvailable: 1

# Configure the pod level securityContext.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65535
  runAsGroup: 65535
  fsGroup: 65535
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

# Configure SecurityContext for the CoreDNS container.
# The defaults satisfy the `restricted` Pod Security Standard, so the chart
# installs into a namespace that enforces it.
# Ensure that required linux capability to bind port number below 1024 is assigned (`CAP_NET_BIND_SERVICE`).
# The CoreDNS image runs as the distroless `nonroot` user (uid/gid 65532) since
# 1.11.0. The numeric ids are set here because images before 1.14.7 declare the
# user by name, which the kubelet cannot verify when `runAsNonRoot` is true.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

servers:
  - zones:
      - zone: .
        use_tcp: true
    port: 53
    # If serviceType is nodePort you can specify nodePort here
    # nodePort: 30053
    # hostPort: 53
    plugins:
      # - name: debug
      - name: log
      - name: errors
      # Serves a /health endpoint on :8080, required for livenessProbe
      - name: health
        configBlock: |-
          lameduck 5s
      # Serves a /ready endpoint on :8181, required for readinessProbe
      - name: ready
      # Required to query kubernetes API for data
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
          ttl 30

      - name: forward
        parameters: ". 192.168.20.1"

      - name: prometheus
        parameters: "0.0.0.0:9153"

      - name: loop
      - name: reload
      - name: loadbalance

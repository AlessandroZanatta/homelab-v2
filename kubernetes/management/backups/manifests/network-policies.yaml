---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cluster-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coredns
          podSelector:
            matchLabels:
              k8s-app: coredns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3
spec:
  podSelector:
    matchLabels:
      kalexlab.xyz/app: backups
      kalexlab.xyz/component: s3
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: backups
              kalexlab.xyz/component: filer
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: backups
              kalexlab.xyz/component: worker
      ports:
        - protocol: TCP
          port: 18333
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8333
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8191
  egress:
    - to:
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: backups
              kalexlab.xyz/component: filer
      ports:
        - protocol: TCP
          port: 18888
    - to:
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: backups
              kalexlab.xyz/component: master
      ports:
        - protocol: TCP
          port: 19333
    - to:
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: backups
              kalexlab.xyz/component: volume
      ports:
        - protocol: TCP
          port: 8444
---

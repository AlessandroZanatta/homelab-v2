apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-bucket-users
spec:
  endpointSelector:
    matchLabels:
      backups.kalexlab.xyz/use: "true"
  egress:
    - toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
          serverNames:
            - backups.kalexlab.xyz

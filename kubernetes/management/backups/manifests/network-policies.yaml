              kalexlab.xyz/app: backups
              kalexlab.xyz/component: filer
        - podSelector:
            matchLabels:
              kalexlab.xyz/app: backups
              kalexlab.xyz/component: s3
      ports:
        - protocol: TCP
          port: 8444
    - from:
        - namespaceSelector:
            matchLabels:

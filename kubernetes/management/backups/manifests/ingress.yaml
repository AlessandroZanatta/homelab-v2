---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backups
spec:
  commonName: backups.kalexlab.xyz
  secretName: backups-certificate
  dnsNames:
    - backups.kalexlab.xyz
    - ui.backups.kalexlab.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backups
  annotations:
    external-dns.kubernetes.io/target: 192.168.10.20
    # S3 returns 403 on a call without credentials
    gatus.kalexlab.xyz/endpoint: |
      conditions:
        - "[STATUS] == any(200,401,403)"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`backups.kalexlab.xyz`)
      services:
        - name: backups-s3
          port: s3-http
    - kind: Rule
      match: Host(`ui.backups.kalexlab.xyz`)
      services:
        - name: backups-admin
          port: admin-http
      middlewares:
        - name: authelia-forward-auth
          namespace: sso
  tls:
    secretName: backups-certificate

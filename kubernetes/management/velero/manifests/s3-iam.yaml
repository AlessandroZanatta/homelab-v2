---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: velero
spec:
  seaweedRef:
    name: backups
    namespace: backups
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: velero
spec:
  seaweedRef:
    name: backups
    namespace: backups
  identityRef:
    name: velero
  secretRef:
    name: velero-s3-credentials
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: velero
spec:
  seaweedRef:
    name: backups
    namespace: backups
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket",
            "s3:GetObject",
            "s3:DeleteObject",
            "s3:PutObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": [
            "arn:aws:s3:::velero",
            "arn:aws:s3:::velero/*"
          ]
        }
      ]
    }
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: velero
spec:
  seaweedRef:
    name: backups
    namespace: backups
  policyRef:
    name: velero
  subjects:
    - kind: S3Identity
      name: velero

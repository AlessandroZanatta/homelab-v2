---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kyverno

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    version: 3.9.0
    releaseName: kyverno
    namespace: kyverno
    valuesFile: values/kyverno.yaml

resources:
  - manifests

patches:
  - target:
      kind: Job
      name: kyverno-scale-to-zero
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: kyverno-scale-to-zero
  - target:
      kind: Job
      name: kyverno-rm-webhooks
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: kyverno-rm-webhooks

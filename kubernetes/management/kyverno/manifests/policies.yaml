---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-namespace-default-deny
  annotations:
    policies.kyverno.io/title: Require Namespace Default Deny
    policies.kyverno.io/category: Homelab Baseline
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Every namespace must contain a NetworkPolicy selecting all pods that denies
      all ingress, and one that denies all egress (may be the same policy).
spec:
  failurePolicy: Ignore
  validationActions: [Audit]
  evaluation:
    # A new namespace is always empty, admission results would only be noise
    admission:
      enabled: false
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  variables:
    - name: netpols
      expression: dyn(resource.List("networking.k8s.io/v1", "networkpolicies", object.metadata.name)).items
  validations:
    - expression: >-
        variables.netpols.exists(p,
          size(p.spec.?podSelector.orValue({})) == 0 &&
          'Ingress' in p.spec.?policyTypes.orValue([]) &&
          size(p.spec.?ingress.orValue([])) == 0)
      message: Namespace has no default-deny ingress NetworkPolicy.
    - expression: >-
        variables.netpols.exists(p,
          size(p.spec.?podSelector.orValue({})) == 0 &&
          'Egress' in p.spec.?policyTypes.orValue([]) &&
          size(p.spec.?egress.orValue([])) == 0)
      message: Namespace has no default-deny egress NetworkPolicy.
---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require Resources
    policies.kyverno.io/category: Homelab Baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers must set requests.cpu, requests.memory and limits.memory.
spec:
  failurePolicy: Ignore
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: ctnrs
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.ctnrs.all(c, c.?resources.?requests.?cpu.hasValue())
      messageExpression: >-
        'Missing requests.cpu: ' + variables.ctnrs.filter(c, !c.?resources.?requests.?cpu.hasValue()).map(c, c.name).join(', ')
    - expression: variables.ctnrs.all(c, c.?resources.?requests.?memory.hasValue())
      messageExpression: >-
        'Missing requests.memory: ' + variables.ctnrs.filter(c, !c.?resources.?requests.?memory.hasValue()).map(c, c.name).join(', ')
    - expression: variables.ctnrs.all(c, c.?resources.?limits.?memory.hasValue())
      messageExpression: >-
        'Missing limits.memory: ' + variables.ctnrs.filter(c, !c.?resources.?limits.?memory.hasValue()).map(c, c.name).join(', ')
---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: disallow-cpu-limits
  annotations:
    policies.kyverno.io/title: Disallow CPU Limits
    policies.kyverno.io/category: Homelab Baseline
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must not set limits.cpu, CFS throttling hurts latency without benefit.
spec:
  failurePolicy: Ignore
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: ctnrs
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.ctnrs.all(c, !c.?resources.?limits.?cpu.hasValue())
      messageExpression: >-
        'limits.cpu set on: ' + variables.ctnrs.filter(c, c.?resources.?limits.?cpu.hasValue()).map(c, c.name).join(', ')
---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-readonly-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Homelab Baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers must set securityContext.readOnlyRootFilesystem to true.
spec:
  failurePolicy: Ignore
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: ctnrs
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.ctnrs.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      messageExpression: >-
        'readOnlyRootFilesystem not true on: ' + variables.ctnrs.filter(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) != true).map(c, c.name).join(', ')
---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-pod-security-context
  annotations:
    policies.kyverno.io/title: Require Pod Security Context
    policies.kyverno.io/category: Homelab Baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pod securityContext must set runAsUser, runAsGroup and fsGroup to 65535
      and fsGroupChangePolicy to OnRootMismatch.
spec:
  failurePolicy: Ignore
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  # TODO: strict 65535 while inspecting, relax to != 0 later
  validations:
    - expression: object.spec.?securityContext.?runAsUser.orValue(-1) == 65535
      message: spec.securityContext.runAsUser must be 65535.
    - expression: object.spec.?securityContext.?runAsGroup.orValue(-1) == 65535
      message: spec.securityContext.runAsGroup must be 65535.
    - expression: object.spec.?securityContext.?fsGroup.orValue(-1) == 65535
      message: spec.securityContext.fsGroup must be 65535.
    - expression: object.spec.?securityContext.?fsGroupChangePolicy.orValue('') == 'OnRootMismatch'
      message: spec.securityContext.fsGroupChangePolicy must be OnRootMismatch.
---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Homelab Baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images must have an explicit tag or digest, and the tag must not be latest
      (except images from registry.kalexlab.xyz).
spec:
  failurePolicy: Ignore
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: ctnrs
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
    - name: badImages
      # Own registry images may use :latest
      expression: >-
        variables.ctnrs.filter(c,
          !c.image.matches('^.+(:[^/:]+|@sha256:[a-f0-9]+)$') ||
          (c.image.endsWith(':latest') && !c.image.startsWith('registry.kalexlab.xyz/')))
  validations:
    - expression: size(variables.badImages) == 0
      messageExpression: >-
        'Untagged or latest image on: ' + variables.badImages.map(c, c.name + ' (' + c.image + ')').join(', ')
---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Probes
    policies.kyverno.io/category: Homelab Baseline
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Long-running containers must define readinessProbe and livenessProbe.
spec:
  failurePolicy: Ignore
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  # Jobs/CronJobs excluded: autogen rules would bypass the ownerReferences matchCondition
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: skip-job-pods
      expression: "!object.metadata.?ownerReferences.orValue([]).exists(o, o.kind == 'Job')"
  validations:
    - expression: object.spec.containers.all(c, has(c.readinessProbe))
      messageExpression: >-
        'Missing readinessProbe: ' + object.spec.containers.filter(c, !has(c.readinessProbe)).map(c, c.name).join(', ')
    - expression: object.spec.containers.all(c, has(c.livenessProbe))
      messageExpression: >-
        'Missing livenessProbe: ' + object.spec.containers.filter(c, !has(c.livenessProbe)).map(c, c.name).join(', ')
---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: disallow-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Disallow Default ServiceAccount
    policies.kyverno.io/category: Homelab Baseline
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods must use a dedicated ServiceAccount, or disable token automount when
      running as default.
spec:
  failurePolicy: Ignore
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.?serviceAccountName.orValue('default') != 'default' ||
        object.spec.?automountServiceAccountToken.orValue(true) == false
      message: Pod uses the default ServiceAccount with token automount enabled.

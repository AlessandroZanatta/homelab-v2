apiVersion: kro.run/v1alpha1
kind: ValkeyStandalone
metadata:
  name: cache
spec:
  # renovate: datasource=docker depName=valkey/valkey
  image: docker.io/valkey/valkey:9.1.4-alpine
  labels:
    kalexlab.xyz/app: policy-reporter
    kalexlab.xyz/component: cache

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: descheduler

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: descheduler
    repo: https://kubernetes-sigs.github.io/descheduler/
    version: 0.36.0
    releaseName: descheduler
    namespace: descheduler
    valuesFile: values/descheduler.yaml

resources:
  - manifests

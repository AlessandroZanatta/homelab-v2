---
kind: Deployment

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

deschedulingInterval: 5m

deschedulerPolicy:
  nodeSelector: "balance.kalexlab.xyz/pool=default"
  metricsProviders:
    - source: KubernetesMetrics
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            minReplicas: 1
            # Avoid evicting databases for balancing, they aren't of much help
            # and cause too much downtime (for single replica ones)
            labelSelector:
              matchExpressions:
                - key: cnpg.io/podRole
                  operator: DoesNotExist
                - key: k8s.mariadb.com/role
                  operator: DoesNotExist
                # Evicting a Job pod fails the Job, it isn't rescheduled
                - key: batch.kubernetes.io/job-name
                  operator: DoesNotExist
            podProtections:
              defaultDisabled:
                - PodsWithLocalStorage
        - name: RemoveDuplicates
        - name: RemovePodsHavingTooManyRestarts
          args:
            podRestartThreshold: 100
            includingInitContainers: true
        - name: RemovePodsViolatingNodeAffinity
          args:
            nodeAffinityType:
              - requiredDuringSchedulingIgnoredDuringExecution
        - name: RemovePodsViolatingNodeTaints
          args:
            # Transient and handled by the kubelet: draining a whole node over
            # a short pressure blip causes an outage
            excludedTaints:
              - node.kubernetes.io/disk-pressure
              - node.kubernetes.io/memory-pressure
              - node.kubernetes.io/pid-pressure
        - name: RemovePodsViolatingInterPodAntiAffinity
        - name: RemovePodsViolatingTopologySpreadConstraint
        - name: LowNodeUtilization
          args:
            evictionLimits:
              node: 5
            metricsUtilization:
              source: KubernetesMetrics
            useDeviationThresholds: true
            thresholds:
              memory: 10
            targetThresholds:
              memory: 10
            evictableNamespaces:
              exclude:
                - kube-system
                - system-upgrade
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization
        deschedule:
          enabled:
            - RemovePodsHavingTooManyRestarts
            - RemovePodsViolatingNodeTaints
            - RemovePodsViolatingNodeAffinity
            - RemovePodsViolatingInterPodAntiAffinity

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sops

helmGlobals:
  chartHome: ../../../.charts

helmCharts:
  - name: sops-secrets-operator
    repo: https://isindir.github.io/sops-secrets-operator
    version: 0.28.1
    releaseName: sops
    namespace: sops
    valuesFile: values/sops-operator.yaml

resources:
  - manifests

---
machine:
  kubelet:
    extraMounts:
      - destination: /var/mnt/data-nvme
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
      - destination: /var/mnt/data-sata
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw

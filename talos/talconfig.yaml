---
clusterName: homelab
endpoint: "https://${CONTROL_PLANE_VIP}:6443"

# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.13.8
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.3

controlPlane:
  patches:
    - "@./patches/machine/vip.yaml"
    - "@./patches/cluster/kube-proxy.yaml"
    - "@./patches/cluster/metrics.yaml"
    - "@./patches/machine/api_access.yaml"

  schematic: &schematic
    customization:
      extraKernelArgs: &extraKernelArgs
        - talos.platform=metal
      systemExtensions: &systemExtensions
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools

worker:
  schematic: *schematic

allowSchedulingOnControlPlanes: true

cniConfig:
  name: none

patches:
  - "@./patches/machine/kubelet.yaml"
  - "@./patches/machine/features.yaml"
  - "@./patches/machine/certsans.yaml"
  - "@./patches/machine/udev.yaml"
  - "@./patches/cluster/coredns.yaml"
  - "@./patches/cluster/admission_control.yaml"
  - "@./patches/cluster/env.yaml"

nodes:
  - hostname: athena
    ipAddress: 192.168.10.2
    installDisk: /dev/mmcblk0
    controlPlane: false
    nodeLabels:
      kalexlab.xyz/node: vpn
    schematic:
      overlay:
        image: siderolabs/sbc-raspberrypi
        name: rpi_generic
      customization:
        extraKernelArgs: *extraKernelArgs
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
    # Due to NodeApplyController, it is only possible to taint
    # a node when it is first registered
    #   ref: https://github.com/siderolabs/talos/discussions/9895
    patches:
      - "@./patches/machine/taint.yaml"

  - hostname: hermes
    ipAddress: 192.168.10.3
    installDisk: /dev/nvme0n1
    controlPlane: false
    userVolumes:
      - name: data-nvme
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-id/nvme-WD_BLACK_SN770_1TB_24014H805228' in disk.symlinks"
          minSize: "100GiB" # Talos will autogrow the size if more is available
          grow: true
      - name: data-sata
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-id/ata-CT1000MX500SSD1_2406E89658C0' in disk.symlinks"
          minSize: "100GiB" # Talos will autogrow the size if more is available
          grow: true
      - name: backups
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-id/ata-TOSHIBA_MQ04UBF100_X5SPP12LT' in disk.symlinks"
          minSize: "900GiB"
          grow: true
    patches:
      - "@./patches/machine/longhorn.yaml"
      - "@./patches/machine/ephemeral.yaml"
    nodeLabels: &nodeLabels
      ingress.kalexlab.xyz/type: traefik
      balance.kalexlab.xyz/pool: default
    nodeAnnotations: &nodeAnnotations
      # Define disk configuration on a per-node basis.
      # Note: this cannot be updated, it is only honoured on Longhorn nodes creation
      #   ref: https://longhorn.io/docs/1.11.2/nodes-and-volumes/nodes/default-disk-and-node-config/#customizing-default-disks-for-new-nodes
      #
      # storageReserved is non-zero due it being interpreted as a empty field otherwise
      #   ref: https://github.com/longhorn/longhorn/issues/11444
      node.longhorn.io/default-disks-config: '[{"name":"data-nvme","path":"/var/mnt/data-nvme","allowScheduling":true,"storageReserved":1,"tags":[]},{"name":"data-sata","path":"/var/mnt/data-sata","allowScheduling":true,"storageReserved":1,"tags":[]}]'

  - hostname: zeus
    ipAddress: 192.168.10.4
    installDisk: /dev/nvme0n1
    controlPlane: true
    userVolumes:
      - name: data-nvme
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-id/nvme-WD_BLACK_SN770_1TB_24453F403703' in disk.symlinks"
          minSize: "100GiB" # Talos will autogrow the size if more is available
          grow: true
      - name: data-sata
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-id/ata-CT1000MX500SSD1_2434E988FA39' in disk.symlinks"
          minSize: "100GiB" # Talos will autogrow the size if more is available
          grow: true
    schematic:
      customization:
        extraKernelArgs:
          - talos.platform=metal
          # ASPM gives PCIe errors on this node
          # Power efficiency looks OK even without ASPM (~7-10W idle)
          - pcie_aspm=off
        systemExtensions: *systemExtensions
    patches:
      - "@./patches/machine/longhorn.yaml"
      - "@./patches/machine/ephemeral.yaml"
    nodeLabels: *nodeLabels
    nodeAnnotations: *nodeAnnotations

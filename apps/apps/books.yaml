---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: books
  namespace: argocd
spec:
  spec:
    project: default
    sources:
      - repoURL: https://github.com/AlessandroZanatta/homelab-v2.git
        targetRevision: master
        path: kubernetes/apps/books
    destination:
      name: in-cluster
      namespace: books
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true

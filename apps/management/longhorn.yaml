---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/AlessandroZanatta/homelab-v2.git
      targetRevision: master
      path: kubernetes/management/longhorn
  destination:
    name: in-cluster
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # Wait for:
      #  - https://github.com/longhorn/longhorn/issues/8753
      #  - https://github.com/longhorn/longhorn-manager/pull/5172
      enabled: false
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
